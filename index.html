<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Snap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              hand: ['"Gochi Hand"', 'cursive'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              camera: {
                body: '#F4F1EA', // Creamy beige
                accent: '#EBC7C3', // Soft pink
                dark: '#2A2A2A',
                silver: '#D1D5DB',
              }
            },
            boxShadow: {
              'camera-deep': '0 20px 50px -12px rgba(0, 0, 0, 0.25)',
              'lens': 'inset 0 4px 20px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.2)',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom texture for the background */
      .bg-dots {
        background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      /* Hide scrollbars for immersive feel */
      body {
        overflow: hidden;
      }
    </style>

    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
</head>

    <div id="root"></div>

</html>
