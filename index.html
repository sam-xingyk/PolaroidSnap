
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Retro Snap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              hand: ['"Gochi Hand"', 'cursive'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              camera: {
                body: '#F4F1EA', // Creamy beige
                accent: '#EBC7C3', // Soft pink
                dark: '#2A2A2A',
                silver: '#D1D5DB',
              }
            },
            boxShadow: {
              'camera-deep': '0 20px 50px -12px rgba(0, 0, 0, 0.25)',
              'lens': 'inset 0 4px 20px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.2)',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom texture for the background */
      .bg-dots {
        background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      /* Hide scrollbars for immersive feel */
      body {
        overflow: hidden;
        touch-action: none; /* Prevent pull-to-refresh on mobile */
      }
      /* Custom Scrollbar for modal */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 4px;
      }
    </style>
    
    <!-- Import Map for ESM modules via CDN -->
    <!-- CRITICAL FIX: ?deps=react@18.2.0 ensures all libs use the SAME React instance -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
        "framer-motion": "https://esm.sh/framer-motion@11.0.20?deps=react@18.2.0,react-dom@18.2.0",
        "uuid": "https://esm.sh/uuid@9.0.1",
        "jszip": "https://esm.sh/jszip@3.10.1",
        "file-saver": "https://esm.sh/file-saver@2.0.5"
      }
    }
    </script>
</head>
  <body>
    <div id="root"></div>

    <!-- Main Application Script -->
    <script type="text/babel" data-type="module">
      import React, { useState, useRef, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { motion, AnimatePresence, useMotionValue, animate } from 'framer-motion';
      import { v4 as uuidv4 } from 'uuid';
      import JSZip from 'jszip';
      // FIX: Use default import for file-saver to avoid SyntaxError with esm.sh
      import saveAs from 'file-saver';

      // List of random captions for variety
      const CAPTIONS = [
        "@VIBES", "@MOOD", "@SUMMER", "@SNAP", "@CHILL", 
        "@MEMORIES", "@YOLO", "@COOL", "@XOXO", "@DAILY", 
        "@LIFE", "@DREAM", "@ART", "@LOVELY", "@RETRO"
      ];

      // --- Photo Component ---
      const PolaroidPhoto = ({ 
        id,
        imageSrc, 
        timestamp, 
        defaultCaption,
        spawnX, 
        spawnY, 
        rotation,
        onDelete 
      }) => {
        const [isEditing, setIsEditing] = useState(false);
        const [note, setNote] = useState(`${defaultCaption}\n${timestamp}`);
        
        // Motion values for manual control over ejection vs drag
        const x = useMotionValue(spawnX);
        const y = useMotionValue(spawnY);
        const rotate = useMotionValue(0);
        const zIndex = useMotionValue(0); // Starts behind, moves to front on interaction

        useEffect(() => {
          // Ejection animation: Start at spawnY and move up
          x.set(spawnX);
          y.set(spawnY); 
          rotate.set(0);

          // Animate to "ejected" position (move up by ~220px relative to spawn)
          // Using a springy backOut to simulate mechanical pop
          const ejectDistance = -220; 
          
          animate(y, spawnY + ejectDistance, { 
            duration: 0.6, 
            ease: [0.175, 0.885, 0.32, 1.275] // Back out easing
          });

          // Slight random rotation for realism
          animate(rotate, rotation, { duration: 0.6 });

        }, []); // Run once on mount

        const handleDragEnd = (event, info) => {
           const trashZone = document.getElementById('trash-zone');
           if (trashZone) {
             const trashRect = trashZone.getBoundingClientRect();
             const pointerX = info.point.x;
             const pointerY = info.point.y;

             // Check if dropped inside trash area
             if (
               pointerX >= trashRect.left &&
               pointerX <= trashRect.right &&
               pointerY >= trashRect.top &&
               pointerY <= trashRect.bottom
             ) {
               onDelete();
             }
           }
        };

        return (
          <motion.div
            style={{ x, y, rotate, zIndex }}
            className="absolute top-0 left-0 w-[220px] bg-white p-4 pb-12 shadow-xl rounded-[2px] touch-none cursor-grab active:cursor-grabbing"
            drag
            dragMomentum={false} // More precise control
            onPointerDown={() => zIndex.set(50)} // Bring to front
            onDragEnd={handleDragEnd}
            whileHover={{ scale: 1.02, boxShadow: "0 25px 50px -12px rgba(0, 0, 0, 0.35)" }}
            whileDrag={{ scale: 1.05, boxShadow: "0 35px 60px -15px rgba(0, 0, 0, 0.4)" }}
          >
            {/* Glossy overlay effect */}
            <div className="absolute inset-0 bg-gradient-to-tr from-white/20 to-transparent pointer-events-none rounded-[2px] z-20"></div>

            {/* Photo Area */}
            <div className="aspect-[3.5/4.2] bg-gray-900 mb-4 overflow-hidden relative border border-gray-100/50 shadow-inner">
              <img src={imageSrc} alt="Polaroid" className="w-full h-full object-cover block" draggable={false} />
              <div className="absolute inset-0 bg-gradient-to-b from-black/10 to-transparent pointer-events-none"></div>
            </div>

            {/* Note Area */}
            <div className="text-center relative z-30" onClick={(e) => e.stopPropagation()}>
              {isEditing ? (
                <textarea
                  autoFocus
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  onBlur={() => setIsEditing(false)}
                  className="w-full h-12 bg-transparent text-gray-700 font-hand text-lg text-center resize-none outline-none p-0 leading-tight"
                />
              ) : (
                <div 
                  onClick={() => setIsEditing(true)}
                  className="font-hand text-gray-700 text-lg leading-tight min-h-[3rem] whitespace-pre-wrap hover:opacity-70 transition-opacity cursor-text transform -rotate-1"
                >
                  {note}
                </div>
              )}
            </div>
          </motion.div>
        );
      };

      // --- Camera Component ---
      const Camera = ({ onCapture }) => {
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const [isFlashing, setIsFlashing] = useState(false);
        const [streamReady, setStreamReady] = useState(false);

        useEffect(() => {
          const startCamera = async () => {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', aspectRatio: 1 },
                audio: false,
              });
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                videoRef.current.onloadedmetadata = () => {
                  videoRef.current?.play();
                  setStreamReady(true);
                };
              }
            } catch (err) {
              console.error("Error accessing camera:", err);
            }
          };

          startCamera();
        }, []);

        const playShutterSound = () => {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;

          const ctx = new AudioContext();
          const t = ctx.currentTime;

          // Generate white noise buffer for mechanical sound
          const bufferSize = ctx.sampleRate * 0.1; // 0.1 seconds
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          // Part 1: The "Click"
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = ctx.createGain();
          
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1000;

          noiseGain.gain.setValueAtTime(0.5, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
          
          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start(t);

          // Part 2: The "Clack"
          const noise2 = ctx.createBufferSource();
          noise2.buffer = buffer;
          const noiseGain2 = ctx.createGain();
          const filter2 = ctx.createBiquadFilter();
          filter2.type = 'lowpass';
          filter2.frequency.value = 1500;

          noiseGain2.gain.setValueAtTime(0.3, t + 0.06);
          noiseGain2.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          
          noise2.connect(filter2);
          filter2.connect(noiseGain2);
          noiseGain2.connect(ctx.destination);
          noise2.start(t + 0.06);
        };

        const takePhoto = () => {
          if (!videoRef.current || !canvasRef.current) return;

          playShutterSound();
          setIsFlashing(true);
          setTimeout(() => setIsFlashing(false), 150);

          const video = videoRef.current;
          const canvas = canvasRef.current;
          const context = canvas.getContext('2d');

          if (context) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            context.translate(canvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            onCapture(imageData);
          }
        };

        return (
          <div className="relative pointer-events-auto select-none">
             <canvas ref={canvasRef} className="hidden" />

            {/* --- Camera Body Shape --- */}
            <div className="relative w-[380px] h-[360px] bg-[#FDFBF7] rounded-[3.5rem] shadow-[0_30px_60px_-12px_rgba(0,0,0,0.5),inset_0_-4px_8px_rgba(0,0,0,0.1),inset_0_2px_4px_rgba(255,255,255,0.8)] flex flex-col items-center justify-start pt-8 z-10">
              
              {/* Subtle texture */}
              <div className="absolute inset-0 rounded-[3.5rem] opacity-[0.03] bg-repeat bg-[length:4px_4px] pointer-events-none"
                   style={{ backgroundImage: 'radial-gradient(#000 1px, transparent 0)' }} 
              />

              {/* Ejection Slot (Top) */}
              <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 w-52 h-5 bg-[#1a1a1a] rounded-t-lg shadow-[inset_0_-2px_4px_rgba(0,0,0,0.5)] z-0">
                  <div className="absolute bottom-0 w-full h-1 bg-[#333]"></div>
              </div>

              {/* --- Top Section: Flash & Viewfinder --- */}
              <div className="w-full px-10 flex justify-between items-start mt-2 z-10">
                
                {/* Flash */}
                <div className="relative w-24 h-14 bg-[#e5e5e5] rounded-2xl border border-[#d1d1d1] shadow-[inset_0_2px_6px_rgba(0,0,0,0.1)] overflow-hidden flex items-center justify-center">
                   <div className="absolute inset-1 border border-[#ccc] bg-[#f0f0f0] grid grid-cols-6 gap-[1px] opacity-80 overflow-hidden rounded-lg">
                     {[...Array(12)].map((_, i) => (
                       <div key={i} className="bg-gradient-to-b from-transparent to-[#ddd] w-full h-full"></div>
                     ))}
                   </div>
                   <div className="absolute inset-0 bg-yellow-100 opacity-20 mix-blend-overlay"></div>
                   {isFlashing && (
                      <div className="absolute inset-0 bg-white shadow-[0_0_60px_30px_rgba(255,255,255,0.9)] z-50 animate-ping"></div>
                   )}
                </div>

                {/* Sensors */}
                <div className="flex gap-3 mt-4 opacity-40">
                  <div className="w-3 h-3 bg-black rounded-full shadow-inner"></div>
                  <div className="w-3 h-3 bg-black rounded-full shadow-inner"></div>
                </div>

                {/* Viewfinder */}
                <div className="w-12 h-12 bg-[#1a1a1a] rounded-2xl border-[3px] border-[#dcdcdc] shadow-[inset_0_2px_8px_rgba(0,0,0,0.8)] relative overflow-hidden">
                   <div className="absolute inset-0 bg-gradient-to-br from-[#333] to-[#000]"></div>
                   <div className="absolute top-2 left-2 w-4 h-4 bg-blue-900 rounded-full opacity-40 blur-[2px]"></div>
                   <div className="absolute bottom-2 right-2 w-2 h-2 bg-white opacity-20 rounded-full blur-[1px]"></div>
                </div>
              </div>

              {/* --- Main Lens Assembly --- */}
              <div className="relative mt-0 z-20">
                 <div className="w-[260px] h-[260px] rounded-full bg-[#FDFBF7] shadow-[8px_14px_20px_rgba(0,0,0,0.1),-4px_-4px_10px_rgba(255,255,255,0.8),inset_0_0_20px_rgba(0,0,0,0.05)] flex items-center justify-center border border-[#f0efe9]">
                    <div className="w-[220px] h-[220px] rounded-full bg-gradient-to-br from-[#e2e2e2] via-[#f5f5f5] to-[#bababa] shadow-[0_4px_10px_rgba(0,0,0,0.2),inset_0_2px_4px_rgba(255,255,255,1)] flex items-center justify-center border border-[#bfbfbf]">
                       <div className="w-[190px] h-[190px] rounded-full bg-[#111] shadow-[inset_0_4px_12px_rgba(255,255,255,0.1),0_10px_20px_rgba(0,0,0,0.4)] flex items-center justify-center relative border-[4px] border-[#222]">
                          <div className="absolute top-3 text-[8px] text-gray-500 tracking-[0.2em] font-sans uppercase font-bold">
                             Instant Lens 60mm
                          </div>
                          <div className="w-[140px] h-[140px] rounded-full overflow-hidden relative bg-black shadow-[inset_0_0_20px_rgba(0,0,0,1)]">
                            <video 
                              ref={videoRef} 
                              autoPlay 
                              playsInline 
                              muted 
                              className={`w-full h-full object-cover transform scale-x-[-1] transition-opacity duration-700 ${streamReady ? 'opacity-100' : 'opacity-0'}`}
                            />
                            <div className="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/5 to-blue-300/10 pointer-events-none"></div>
                            <div className="absolute top-8 right-10 w-12 h-6 bg-white opacity-20 rounded-full blur-md rotate-[-45deg] pointer-events-none"></div>
                            <div className="absolute bottom-6 left-8 w-4 h-2 bg-white opacity-30 rounded-full blur-sm pointer-events-none"></div>
                          </div>
                       </div>
                    </div>
                 </div>
                 {/* Removed small black circle from here */}
              </div>

              {/* --- Shutter Button (Right) --- */}
              <button 
                onClick={takePhoto}
                className="absolute bottom-[50px] right-[20px] w-16 h-16 rounded-full bg-[#FDFBF7] shadow-[-4px_-4px_10px_rgba(255,255,255,1),4px_4px_10px_rgba(0,0,0,0.15)] flex items-center justify-center group active:scale-95 transition-all cursor-pointer z-30"
              >
                 <div className="w-12 h-12 rounded-full bg-[#E88F88] border-2 border-[#dcaaaa] shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),0_2px_4px_rgba(0,0,0,0.2)] group-hover:bg-[#ef9a93] transition-colors"></div>
              </button>

              <div className="absolute left-[-8px] top-1/2 w-3 h-10 bg-[#d1d1d1] rounded-r-md shadow-md border-l border-[#aaa]"></div>
              <div className="absolute right-[-8px] top-1/2 w-3 h-10 bg-[#d1d1d1] rounded-l-md shadow-md border-r border-[#aaa]"></div>

            </div>
          </div>
        );
      };

      // --- App Component ---
      const App = () => {
        const [photos, setPhotos] = useState([]);
        const [flashActive, setFlashActive] = useState(false);
        const [isDownloadModalOpen, setIsDownloadModalOpen] = useState(false);
        const [selectedPhotoIds, setSelectedPhotoIds] = useState([]);

        const handleCapture = (imageData) => {
          setFlashActive(true);
          setTimeout(() => setFlashActive(false), 150);

          const now = new Date();
          const timestamp = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
          
          // Spawn Logic
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;
          const spawnX = centerX - 110; // 220px width / 2
          const spawnY = centerY - 140; 

          // Random Caption Logic
          const randomCaption = CAPTIONS[Math.floor(Math.random() * CAPTIONS.length)];

          const newPhoto = {
            id: uuidv4(),
            imageSrc: imageData,
            timestamp,
            defaultCaption: randomCaption,
            spawnX,
            spawnY,
            rotation: (Math.random() - 0.5) * 15, 
          };

          setPhotos((prev) => [...prev, newPhoto]);
        };

        const handleDelete = (id) => {
          setPhotos((prev) => prev.filter((photo) => photo.id !== id));
        };

        const toggleSelection = (id) => {
          setSelectedPhotoIds(prev => 
            prev.includes(id) ? prev.filter(pid => pid !== id) : [...prev, id]
          );
        };

        const handleDownload = async () => {
          const selectedPhotos = photos.filter(p => selectedPhotoIds.includes(p.id));
          if (selectedPhotos.length === 0) return;

          if (selectedPhotos.length === 1) {
            // Single download
            saveAs(selectedPhotos[0].imageSrc, `retro-snap-${selectedPhotos[0].id.slice(0, 6)}.jpg`);
          } else {
            // Batch download via Zip
            const zip = new JSZip();
            selectedPhotos.forEach(photo => {
               // Remove header 'data:image/jpeg;base64,' to get raw base64
               const imgData = photo.imageSrc.split(',')[1];
               zip.file(`retro-snap-${photo.id.slice(0, 6)}.jpg`, imgData, {base64: true});
            });
            
            const content = await zip.generateAsync({type: "blob"});
            saveAs(content, "retro-snaps.zip");
          }
          setIsDownloadModalOpen(false);
          setSelectedPhotoIds([]);
        };

        return (
          <div className="min-h-screen bg-[#eaeaea] bg-dots overflow-hidden relative font-sans selection:bg-pink-200">
            
            {/* Global Flash Effect */}
            <div className={`fixed inset-0 bg-white pointer-events-none transition-opacity duration-300 z-[100] ${flashActive ? 'opacity-100' : 'opacity-0'}`}></div>

            {/* --- Download Button (Top Right - Icon Only) --- */}
            <button 
              onClick={() => {
                if (photos.length > 0) {
                  setIsDownloadModalOpen(true);
                } else {
                  alert("Take some photos first!");
                }
              }}
              className="fixed top-6 right-6 z-[90] text-[#333333] hover:opacity-70 transition-all active:scale-95 w-10 h-10"
              title="Download Photos"
            >
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 1024 1024" 
                className="w-full h-full"
                fill="currentColor"
              >
                <path d="M826.76 798.816c0 15.18-12.307 27.487-27.488 27.487H225.12c-15.18 0-27.488-12.307-27.488-27.487 0-15.18 12.307-27.488 27.488-27.488h574.152c15.182 0 27.488 12.307 27.488 27.488z m-314.625-77.513c-15.18 0-27.487-12.308-27.487-27.489V225.12c0-15.18 12.306-27.487 27.487-27.487s27.487 12.306 27.487 27.487v468.695c0 15.181-12.306 27.489-27.487 27.489z" />
                <path d="M531.572 713.073c-10.735 10.734-28.139 10.734-38.873 0l-206.3-206.3c-10.733-10.733-10.733-28.138 0-38.873 10.735-10.733 28.14-10.733 38.874 0l206.299 206.3c10.734 10.734 10.734 28.138 0 38.873z" />
                <path d="M492.699 713.072c-10.735-10.734-10.735-28.139 0-38.873l206.298-206.3c10.734-10.733 28.14-10.733 38.874 0 10.733 10.735 10.733 28.14 0 38.875l-206.3 206.299c-10.734 10.734-28.138 10.734-38.872-0.001z" />
              </svg>
            </button>

            {/* --- Download Modal --- */}
            <AnimatePresence>
              {isDownloadModalOpen && (
                <motion.div 
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  className="fixed inset-0 z-[200] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
                  onClick={() => setIsDownloadModalOpen(false)}
                >
                  <motion.div 
                    initial={{ scale: 0.9, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    exit={{ scale: 0.9, opacity: 0 }}
                    className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                      <h2 className="text-xl font-bold text-gray-800">Select Photos to Download</h2>
                      <button onClick={() => setIsDownloadModalOpen(false)} className="text-gray-400 hover:text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-6 h-6">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        {photos.map(photo => {
                          const isSelected = selectedPhotoIds.includes(photo.id);
                          return (
                            <div 
                              key={photo.id} 
                              onClick={() => toggleSelection(photo.id)}
                              className={`relative aspect-square rounded-lg overflow-hidden cursor-pointer transition-all border-2 ${isSelected ? 'border-blue-500 ring-2 ring-blue-200' : 'border-transparent hover:border-gray-200'}`}
                            >
                              <img src={photo.imageSrc} className="w-full h-full object-cover" />
                              {isSelected && (
                                <div className="absolute inset-0 bg-blue-500/20 flex items-center justify-center">
                                  <div className="bg-blue-500 text-white rounded-full p-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" className="w-6 h-6">
                                      <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                    </svg>
                                  </div>
                                </div>
                              )}
                            </div>
                          )
                        })}
                      </div>
                    </div>

                    <div className="p-6 bg-gray-50 border-t border-gray-100 flex justify-between items-center">
                      <span className="text-sm text-gray-500">{selectedPhotoIds.length} selected</span>
                      <div className="flex gap-3">
                        <button 
                          onClick={() => setSelectedPhotoIds(photos.map(p => p.id))}
                          className="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 font-medium"
                        >
                          Select All
                        </button>
                        <button 
                          disabled={selectedPhotoIds.length === 0}
                          onClick={handleDownload}
                          className={`px-6 py-2 rounded-full text-white font-semibold shadow-md transition-all ${selectedPhotoIds.length > 0 ? 'bg-blue-600 hover:bg-blue-700 active:scale-95' : 'bg-gray-300 cursor-not-allowed'}`}
                        >
                          Download {selectedPhotoIds.length > 1 ? 'ZIP' : ''}
                        </button>
                      </div>
                    </div>
                  </motion.div>
                </motion.div>
              )}
            </AnimatePresence>

            {/* Trash Drop Zone */}
            <div id="trash-zone" className="fixed bottom-8 right-8 w-20 h-20 border-2 border-gray-300 border-dashed rounded-full flex items-center justify-center text-gray-400 z-0 transition-colors hover:bg-red-50 hover:border-red-400 hover:text-red-400">
              <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </div>

            {/* Instructions */}
            <div className="fixed bottom-4 left-1/2 transform -translate-x-1/2 text-gray-400 text-xs font-bold tracking-widest uppercase z-0 pointer-events-none text-center">
              <p>DRAG PHOTO TO MOVE</p>
              <p className="text-[10px] opacity-60 mt-1">USE TRASH BIN TO DELETE</p>
            </div>

            {/* Container for Photos & Camera */}
            <div className="relative w-full h-full flex items-center justify-center min-h-screen">
              
              {/* Photos Layer (rendered first, but z-index controlled via motion values) */}
              {photos.map((photo) => (
                <PolaroidPhoto 
                  key={photo.id}
                  {...photo}
                  onDelete={() => handleDelete(photo.id)}
                />
              ))}

              {/* Camera Layer (rendered last to visually sit on top initially) */}
              <Camera onCapture={handleCapture} />

            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
